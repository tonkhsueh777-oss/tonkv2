name: Import original LZX content and history
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'tonkhsueh777-oss/tonkv2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve source history and copy all original content
        shell: bash
        run: |
          set -euo pipefail
          if [ -f assets/video/video_jiaqing.mp4 ]; then
            echo "Original content already imported."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add lzx https://github.com/tonkhsueh777-oss/lzx.git
          git fetch lzx main
          source_commit=0ec96a92a08334f6e1da47ca0e2295f09b02b562
          git merge --allow-unrelated-histories -s ours "$source_commit" -m "Preserve complete LZX source history"
          mkdir -p "$RUNNER_TEMP/lzx-source"
          git archive "$source_commit" | tar -x -C "$RUNNER_TEMP/lzx-source"
          rsync -a --ignore-existing "$RUNNER_TEMP/lzx-source/" ./
          git add .
          git commit -m "Copy all original projects, news, IP, copyright and videos"
          git push origin HEAD:main
